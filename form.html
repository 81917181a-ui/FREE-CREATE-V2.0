<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ダイヤ作成フォーム</title>
<style>
  body { font-family: sans-serif; max-width: 760px; margin: 24px auto; padding: 0 16px; color: #111; }
  h1 { font-size: 20px; border-bottom: 2px solid #111; padding-bottom: 6px; }
  fieldset { border: 1px solid #111; margin: 16px 0; padding: 12px; }
  legend { font-weight: bold; padding: 0 6px; }
  .row { display: flex; gap: 8px; margin: 6px 0; align-items: center; flex-wrap: wrap; }
  input, select, textarea, button { font-size: 14px; padding: 6px; border: 1px solid #111; background: #fff; border-radius: 0; }
  button { cursor: pointer; background: #111; color: #fff; }
  button.sub { background: #fff; color: #111; }
  textarea { width: 100%; box-sizing: border-box; min-height: 80px; }
  .tag { display: inline-block; border: 1px solid #111; padding: 2px 6px; margin: 2px; }
  .tag button { padding: 0 4px; margin-left: 4px; }
  label.chk { display: inline-block; margin: 2px 10px 2px 0; }
  #status { margin-top: 12px; font-weight: bold; white-space: pre-wrap; }
  .hint { color: #555; font-size: 12px; }
  /* 駅と所要時間: 縦並び */
  .stcol { display: flex; flex-direction: column; gap: 0; max-width: 360px; }
  .st-box { display: flex; gap: 8px; margin: 0; }
  .st-box input { flex: 1; min-width: 0; }
  .gap-box { display: flex; align-items: center; gap: 8px; margin: 0; padding: 4px 0 4px 16px; border-left: 3px solid #111; margin-left: 12px; }
  .gap-box input { width: 120px; }
  .gap-box span { color: #555; font-size: 12px; }
  /* 特殊区間 */
  .sp-item { border: 1px solid #111; padding: 8px; margin: 8px 0; }
  .sp-item select { min-width: 100px; }
</style>
</head>
<body>
<h1>鉄道ダイヤ作成</h1>

<fieldset>
  <legend>駅と所要時間</legend>
  <div class="hint">駅名の間の欄に、その2駅間の所要時間(秒)を入力します。</div>
  <div id="stations" class="stcol"></div>
  <div class="row"><button type="button" class="sub" id="addStation">追加する</button></div>
</fieldset>

<fieldset>
  <legend>主要駅</legend>
  <div class="row">
    <select id="keySel"></select>
    <button type="button" id="addKey">追加する</button>
  </div>
  <div id="keyList"></div>
</fieldset>

<fieldset>
  <legend>運行時間・条件</legend>
  <div class="row">
    <label>開始時間 <input type="time" id="startTime" value="06:00"></label>
    <label>終了時間 <input type="time" id="endTime" value="23:00"></label>
    <label>編成数 <input type="number" id="trainsets" value="4" min="1" max="50" style="width:70px"></label>
  </div>
  <div>備考（自由記述）</div>
  <textarea id="remarks" placeholder="例: 停車時間は40秒、折返しは5分、快速を2往復に1本走らせる"></textarea>
</fieldset>

<fieldset>
  <legend>退避可能駅</legend>
  <div id="passList" class="hint">駅名を入力すると選択肢が表示されます。</div>
</fieldset>

<fieldset>
  <legend>特殊区間</legend>
  <div class="hint">ここに載せていない区間は複線として扱います。</div>
  <div id="spList"></div>
  <div class="row"><button type="button" class="sub" id="addSp">追加する</button></div>
</fieldset>

<fieldset>
  <legend>出力先</legend>
  <div class="row">
    <label><input type="radio" name="target" value="dm" checked> DM</label>
    <label><input type="radio" name="target" value="channel"> サーバーのチャンネル</label>
  </div>
  <div class="row">
    <label>サーバー <select id="serverSel" disabled><option value="">読み込み中</option></select></label>
  </div>
  <div class="row">
    <label>チャンネル <select id="channelSel" disabled><option value="">サーバーを選択してください</option></select></label>
  </div>
  <div class="hint">あなたとBOTの両方が参加していて、両方が閲覧・送信できるチャンネルのみ表示されます。</div>
</fieldset>

<button type="button" id="submit">出力</button>
<div id="status"></div>

<script>
const T = new URLSearchParams(location.search).get("t") || "";
const $ = (id) => document.getElementById(id);

// ---- 状態 ----
// sts[i].sec は「駅i から 駅i+1 までの所要時間(秒)」。最終駅の sec は使わない。
let sts = [{ name: "", sec: "" }, { name: "", sec: "" }];
let keys = [];
let specials = [];            // { start, end, kind: "single" | "quad" | "" }
let passChecked = new Set();

function names() { return sts.map(s => s.name.trim()).filter(Boolean); }

// ---- 駅と所要時間（縦並び） ----
function renderStations() {
  const box = $("stations");
  box.innerHTML = "";
  sts.forEach((s, i) => {
    const row = document.createElement("div");
    row.className = "st-box";
    const inp = document.createElement("input");
    inp.placeholder = "駅名";
    inp.value = s.name;
    inp.addEventListener("input", () => { s.name = inp.value; updateGapHints(); refresh(); });
    row.appendChild(inp);
    const rm = document.createElement("button");
    rm.type = "button"; rm.className = "sub"; rm.textContent = "削除";
    rm.addEventListener("click", () => {
      if (sts.length <= 2) return;
      sts.splice(i, 1);
      renderStations(); refresh();
    });
    row.appendChild(rm);
    box.appendChild(row);

    if (i < sts.length - 1) {
      const g = document.createElement("div");
      g.className = "gap-box";
      const sec = document.createElement("input");
      sec.type = "number"; sec.min = "0"; sec.placeholder = "所要時間(秒)";
      sec.value = s.sec;
      sec.addEventListener("input", () => { s.sec = sec.value; });
      const hint = document.createElement("span");
      hint.className = "gap-hint";
      g.appendChild(sec); g.appendChild(hint);
      box.appendChild(g);
    }
  });
  updateGapHints();
}

function updateGapHints() {
  document.querySelectorAll("#stations .gap-hint").forEach((h, i) => {
    const a = (sts[i] && sts[i].name.trim()) || "?";
    const b = (sts[i + 1] && sts[i + 1].name.trim()) || "?";
    h.textContent = a + " - " + b;
  });
}

// ---- 共通 ----
function fillSelect(sel, list, value) {
  sel.innerHTML = "";
  list.forEach(n => { const o = document.createElement("option"); o.value = o.textContent = n; sel.appendChild(o); });
  if (list.includes(value)) sel.value = value;
}

function renderTags(box, items, onRemove, label) {
  box.innerHTML = "";
  items.forEach((it, i) => {
    const s = document.createElement("span");
    s.className = "tag";
    s.textContent = label(it);
    const b = document.createElement("button");
    b.type = "button"; b.className = "sub"; b.textContent = "x";
    b.addEventListener("click", () => onRemove(i));
    s.appendChild(b);
    box.appendChild(s);
  });
}

// ---- 特殊区間 ----
function renderSpecials(list) {
  const box = $("spList");
  box.innerHTML = "";
  specials.forEach((sp, i) => {
    if (!list.includes(sp.start)) sp.start = list[0] || "";
    if (!list.includes(sp.end)) sp.end = list[list.length - 1] || "";
    const item = document.createElement("div");
    item.className = "sp-item";

    const r1 = document.createElement("div");
    r1.className = "row";
    const s1 = document.createElement("select");
    const s2 = document.createElement("select");
    fillSelect(s1, list, sp.start); fillSelect(s2, list, sp.end);
    s1.addEventListener("change", () => { sp.start = s1.value; });
    s2.addEventListener("change", () => { sp.end = s2.value; });
    const sep = document.createElement("span"); sep.textContent = "〜";
    const rm = document.createElement("button");
    rm.type = "button"; rm.className = "sub"; rm.textContent = "削除";
    rm.addEventListener("click", () => { specials.splice(i, 1); refresh(); });
    r1.appendChild(s1); r1.appendChild(sep); r1.appendChild(s2); r1.appendChild(rm);

    const r2 = document.createElement("div");
    r2.className = "row";
    [["single", "単線"], ["quad", "複々線"]].forEach(([k, label]) => {
      const l = document.createElement("label");
      const c = document.createElement("input");
      c.type = "checkbox"; c.checked = sp.kind === k;
      c.addEventListener("change", () => {
        sp.kind = c.checked ? k : "";
        r2.querySelectorAll("input").forEach(o => { if (o !== c) o.checked = false; }); // どちらか一方のみ
      });
      l.appendChild(c); l.appendChild(document.createTextNode(" " + label));
      r2.appendChild(l);
    });

    item.appendChild(r1); item.appendChild(r2);
    box.appendChild(item);
  });
}

// ---- 駅名に連動して全体を更新 ----
function refresh() {
  const list = names();
  keys = keys.filter(k => list.includes(k));
  fillSelect($("keySel"), list, $("keySel").value);
  renderTags($("keyList"), keys, i => { keys.splice(i, 1); refresh(); }, k => k);
  renderSpecials(list);

  const box = $("passList");
  document.querySelectorAll("#passList input:checked").forEach(c => passChecked.add(c.value));
  box.innerHTML = "";
  if (!list.length) { box.textContent = "駅名を入力すると選択肢が表示されます。"; return; }
  list.forEach(n => {
    const l = document.createElement("label");
    l.className = "chk";
    const c = document.createElement("input");
    c.type = "checkbox"; c.value = n; c.checked = passChecked.has(n);
    c.addEventListener("change", () => { c.checked ? passChecked.add(n) : passChecked.delete(n); });
    l.appendChild(c); l.appendChild(document.createTextNode(" " + n));
    box.appendChild(l);
  });
}

$("addStation").onclick = () => { sts.push({ name: "", sec: "" }); renderStations(); refresh(); };
$("addKey").onclick = () => { const v = $("keySel").value; if (v && !keys.includes(v)) { keys.push(v); refresh(); } };
$("addSp").onclick = () => {
  const list = names();
  specials.push({ start: list[0] || "", end: list[list.length - 1] || "", kind: "" });
  refresh();
};
let guilds = [];   // [{id, name, channels:[{id, name}]}]  ボットとユーザー双方が居るサーバーのみ

function applyTargetState() {
  const on = document.querySelector('input[name="target"]:checked').value === "channel";
  $("serverSel").disabled = !on || !guilds.length;
  $("channelSel").disabled = !on || !$("channelSel").options.length || !$("channelSel").value;
}
document.querySelectorAll('input[name="target"]').forEach(r => r.addEventListener("change", applyTargetState));

function fillChannels() {
  const g = guilds.find(x => x.id === $("serverSel").value);
  const sel = $("channelSel");
  sel.innerHTML = "";
  if (!g || !g.channels.length) { sel.innerHTML = '<option value="">送信可能なチャンネルがありません</option>'; }
  else g.channels.forEach(c => { const o = document.createElement("option"); o.value = c.id; o.textContent = "#" + c.name; sel.appendChild(o); });
  applyTargetState();
}
$("serverSel").addEventListener("change", fillChannels);

async function loadChannels() {
  try {
    const r = await fetch("/api/channels?t=" + encodeURIComponent(T));
    if (!r.ok) throw new Error((await r.json()).detail || r.status);
    guilds = await r.json();
    const ss = $("serverSel");
    ss.innerHTML = "";
    if (!guilds.length) {
      ss.innerHTML = '<option value="">共通のサーバーがありません</option>';
      $("channelSel").innerHTML = '<option value="">-</option>';
      applyTargetState();
      return;
    }
    guilds.forEach(g => { const o = document.createElement("option"); o.value = g.id; o.textContent = g.name; ss.appendChild(o); });
    fillChannels();
  } catch (e) {
    $("serverSel").innerHTML = '<option value="">取得失敗</option>';
    $("channelSel").innerHTML = '<option value="">取得失敗</option>';
    $("status").textContent = "サーバー一覧の取得に失敗しました: " + e.message;
  }
}

$("submit").onclick = async () => {
  if (sts.some(s => !s.name.trim())) { $("status").textContent = "駅名が空の欄があります。入力するか削除してください。"; return; }
  const rows = sts.map(s => ({ name: s.name.trim(), seconds: parseInt(s.sec || "0", 10) || 0 }));
  if (rows.length < 2) { $("status").textContent = "駅は2つ以上入力してください。"; return; }
  const target = document.querySelector('input[name="target"]:checked').value;
  if (target === "channel" && !$("channelSel").value) { $("status").textContent = "サーバーとチャンネルを選択してください。"; return; }
  // 単線 / 複々線 が選ばれた区間だけ送る（未選択は複線扱いなので送らない）
  const quad = specials.filter(s => s.kind && s.start && s.end && s.start !== s.end)
                       .map(s => ({ start: s.start, end: s.end, kind: s.kind }));
  const body = {
    stations: rows,
    key_stations: keys,
    start_time: $("startTime").value,
    end_time: $("endTime").value,
    trainsets: parseInt($("trainsets").value || "1", 10),
    remarks: $("remarks").value,
    passing_stations: [...passChecked].filter(n => rows.some(r => r.name === n)),
    quad_sections: quad,
    target: target,
    channel_id: target === "channel" ? $("channelSel").value : ""
  };
  $("submit").disabled = true;
  $("status").textContent = "送信中";
  try {
    const r = await fetch("/api/submit?t=" + encodeURIComponent(T), {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body)
    });
    const j = await r.json();
    if (!r.ok) throw new Error(typeof j.detail === "string" ? j.detail : "入力内容を確認してください");
    $("status").textContent = j.message;
  } catch (e) {
    $("status").textContent = "エラー: " + e.message;
  } finally {
    $("submit").disabled = false;
  }
};

renderStations();
refresh();
loadChannels();
</script>
</body>
</html>
